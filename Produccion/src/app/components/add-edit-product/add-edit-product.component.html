<div class="row mt-3">
  <div class="col-lg-4 offset-lg-4">
    <div class="card text-width mb-3" style="max-width: 40rem">
      <div class="card-header text-center">Agregar Producto</div>
      <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="addProduct()">
          <input
            formControlName="name"
            type="text"
            class="form-control"
            placeholder="Ingresar Nombre"
          />
          <span *ngIf="form.get('name')?.hasError('required') && form.get('name')?.touched">El campo nombre es <strong>requerido</strong> </span>
          <input
            formControlName="description"
            type="text"
            class="form-control mt-4"
            placeholder="Ingresar Descripción"
          />
          <span *ngIf="form.get('description')?.hasError('required') && form.get('description')?.touched">El campo descripción es <strong>requerido</strong> </span>
          <input
            formControlName="price"
            type="number"
            class="form-control mt-4"
            placeholder="Ingresar Precio"
          />
          <span *ngIf="form.get('price')?.hasError('required') && form.get('price')?.touched">El precio es <strong>requerido</strong> </span>
          <input
            formControlName="stock"
            type="number"
            class="form-control mt-4"
            placeholder="Ingresar stock"
          />
          <span *ngIf="form.get('stock')?.hasError('required') && form.get('stock')?.touched">El stock es <strong>requerido</strong> </span>
          <div class="row mt-4 text-center">
            <div class="col-lg-12">
              <button type="submit" [disabled]="form.invalid" class="btn btn-success">Aceptar</button>
              <button
                type="button"
                routerLink="/"
                class="btn btn-danger"
                style="margin-left: 20px"
              >
                Volver
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
